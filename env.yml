# Read only by dbt Projects on Snowflake; resolved by Snowflake before dbt starts.
# Select with ENVIRONMENT = '<name>' (SQL) / --env <name> (snow CLI). Pair it with the
# matching --target. Keys must be UPPERCASE and start with DBT_.
env_config:
  default_environment: dev
  environments:
    - name: dev
      env:
        # First name + last initial of the caller (e.g. DEVONB), else the user name.
        # Override for one run: ENV_VARS = ('DBT_DEV_PREFIX' = 'MYPREFIX').
        DBT_DEV_PREFIX: "{{ select prefix FROM DEV_T3_INTEGRATION.DBT.DEV_PREFIX }}"
    - name: test
      env:
        DBT_ENV_NAME: test
    - name: uat
      env:
        DBT_ENV_NAME: uat
    - name: prod
      env:
        DBT_ENV_NAME: prod
