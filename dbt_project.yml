name: edw
version: "1.0.0"
config-version: 2

profile: edw

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
analysis-paths: ["analyses"]

clean-targets: ["target", "dbt_packages"]

# Project variables, read in models with {{ var('name') }}.
# Override for one run: dbt build --vars '{tasty_bytes_order_start_date: "2022-06-01"}'
vars:
  # First order date loaded by the Tasty Bytes models. Keeps test builds small;
  # the data ends 2022-11-01, so this default is about one month (~38M order lines).
  tasty_bytes_order_start_date: "2022-10-01"

# Checks (dbt v2): static rules over the project's DAG and YAML, run before every
# build and by `dbt check`; no warehouse needed. The only ones here come from
# dbt_project_evaluator. Off by default; run on demand:
#   dbt check --vars '{run_project_evaluator: true}'
# (The default must be inside var(): `vars:` above isn't applied to these configs.)
checks:
  dbt_project_evaluator:
    +enabled: "{{ var('run_project_evaluator', false) }}"

# dbt_project_evaluator also ships coding-agent skills. Not installed; setting a
# provider with the skills disabled stops dbt warning about them on every run.
flags:
  ai_provider: claude
skills:
  dbt_project_evaluator:
    +enabled: false

# Folder layout: models/<TIER>/<SCHEMA>/<model>.sql
#   <TIER>   -> database <ENV>_<TIER>      (generate_database_name; ENV = target name)
#   <SCHEMA> -> schema   <SCHEMA>          (generate_schema_name; DEV adds <DBT_DEV_PREFIX>_)
# +database below must equal the tier folder name. Materialization defaults are set
# per tier and can be overridden per schema folder or per model.
models:
  edw:
    T3_REFERENCE:
      +database: T3_REFERENCE
      +materialized: view
    T3_INTEGRATION:
      +database: T3_INTEGRATION
      +materialized: view
    T4_DATA_MART:
      +database: T4_DATA_MART
      +materialized: table
      # Schema-level override example:
      # HCM:
      #   +materialized: incremental
    T5_PRESENTATION:
      +database: T5_PRESENTATION
      +materialized: view
